<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RONDA ONE · Projetos</title><style>body{margin:0;background:#f2f1ed;color:#171717;font-family:Inter,Arial,sans-serif}.bar{height:52px;background:#111;color:#fff;display:flex;align-items:center;gap:10px;padding:0 18px}.bar a{color:#bbb;text-decoration:none;font-size:11px;font-weight:800;padding:7px 9px}.bar a.active{color:#fff;background:#2a2a2a;border-radius:7px}.wrap{max-width:1050px;margin:40px auto;padding:0 22px}.head{display:flex;justify-content:space-between;align-items:end}.head h1{margin:0;font-size:30px}.head p{color:#777}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:22px}.card{background:#fff;border:1px solid #ddd9d1;border-radius:14px;padding:16px}.card h3{margin:0 0 7px}.card small{color:#777}.card a{display:inline-block;margin-top:14px;background:#171717;color:#fff;text-decoration:none;padding:9px 12px;border-radius:8px;font-size:11px;font-weight:800}.empty{padding:30px;background:#fff;border:1px dashed #bbb;border-radius:14px;margin-top:20px;color:#666}</style></head><body><div class="bar"><strong>RONDA ONE 0.7</strong><a href="/ronda">RONDA</a><a href="/design/">DESIGN</a><a class="active" href="/projects/">PROJETOS</a></div><main class="wrap"><div class="head"><div><h1>Projetos</h1><p>Núcleo compartilhado entre Ronda Editorial e Ronda Design.</p></div></div><div id="status"></div><div class="grid" id="grid"></div></main><script>async function load(){const s=document.getElementById('status'),g=document.getElementById('grid');try{const r=await fetch('/api/projects'),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Falha');if(!j.projects.length){s.innerHTML='<div class="empty">Ainda não existem projetos compartilhados. Na Ronda, gere um carrossel e clique em <b>RONDA DESIGN</b>.</div>';return;}g.innerHTML=j.projects.map(p=>`<article class="card"><small>${new Date(p.updatedAt).toLocaleString('pt-BR')}</small><h3>${esc(p.title)}</h3><small>${esc(p.source)}</small><br><a href="/design/?project=${encodeURIComponent(p.id)}">Abrir no Design</a></article>`).join('');}catch(e){s.innerHTML='<div class="empty"><b>Projetos compartilhados ainda não estão ligados ao D1.</b><br>'+esc(e.message)+'<br><br>O handoff local Ronda → Design continua funcionando no mesmo navegador.</div>';}}function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}load();</script></body></html>
